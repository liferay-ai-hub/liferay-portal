assemble:
    -   from: build/static
        into: static
liferay-ai-hub-custom-element:
    cssURLs:
        -   css/main.css
    friendlyURLMapping: liferay-ai-hub-custom-element
    htmlAttributes:
        ai-hub-url: "https://ai.hub.liferay.com"
        chatbot-external-reference-code: "MY_CHATBOT"
        id: "aihub-chat-widget-script"
        spritemap-url: "/o/classic-theme/images/clay/icons.svg"
    htmlElementName: liferay-ai-hub-custom-element
    instanceable: false
    name: Liferay AI Hub
    portletCategoryName: category.client-extensions
    type: customElement
    urls:
        -   js/main.js
    useESM: true