#
# Application
#

liferay.ai.hub.crawler.domain.url=https://en.wikipedia.org
liferay.ai.hub.crawler.elasticsearch.host=http://elasticsearch
liferay.ai.hub.crawler.elasticsearch.pipeline=vertex-embed-web-crawl-2
liferay.ai.hub.crawler.elasticsearch.pipeline.enabled=true
liferay.ai.hub.crawler.elasticsearch.port=9200
liferay.ai.hub.crawler.max.crawl.depth=1
liferay.ai.hub.crawler.max.duration=30
liferay.ai.hub.crawler.output.index=google-vertex-ai-embeddings-2
liferay.ai.hub.crawler.output.sink=elasticsearch
liferay.ai.hub.crawler.seed.url=https://en.wikipedia.org/wiki/F%C3%BCr_Elise

#
# OAuth
#

liferay.oauth.application.external.reference.codes=\
    liferay-aihub-etc-spring-boot-oaua

liferay.oauth.urls.excludes=/ready

#
# Spring Boot
#
com.liferay.lxc.dxp.domains=localhost:8080
com.liferay.lxc.dxp.mainDomain=localhost:8080
com.liferay.lxc.dxp.server.protocol=http

server.port=58081